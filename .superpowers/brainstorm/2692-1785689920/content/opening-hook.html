<h2>开头 3 秒钩子设计（0-3s）</h2>
<p class="subtitle">"二向箔"标题砸屏 + 箔光斜掠，之后才切入太空远景。</p>

<div class="mockup">
  <div class="mockup-header">改进后 · 开头钩子（16:9 模拟）</div>
  <div class="mockup-body" style="position:relative;background:#02030a;border-radius:8px;overflow:hidden;aspect-ratio:16/9;">
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center, #0a0f22 0%, #02030a 75%);"></div>
    <!-- 斜向箔光 -->
    <div style="position:absolute;left:-10%;top:30%;width:120%;height:4px;background:linear-gradient(90deg,transparent,#9fd0ff,rgba(160,200,255,0.9),#9fd0ff,transparent);box-shadow:0 0 24px rgba(140,200,255,0.9);transform:rotate(-12deg);"></div>
    <div style="position:absolute;left:-10%;top:31%;width:120%;height:1px;background:linear-gradient(90deg,transparent,#cfe8ff,transparent);box-shadow:0 0 40px rgba(180,220,255,0.8);transform:rotate(-12deg);"></div>
    <!-- 标题 -->
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
      <div style="font-size:96px;font-weight:200;letter-spacing:0.4em;color:#eaf3ff;text-shadow:0 0 40px rgba(150,210,255,0.9),0 0 120px rgba(90,170,255,0.5);transform:translateX(0.15em);">二向箔</div>
    </div>
    <!-- 副标题 -->
    <div style="position:absolute;bottom:16%;width:100%;text-align:center;font-size:16px;letter-spacing:0.3em;color:rgba(160,200,255,0.8);">三维空间坍缩 · 太阳系二维化</div>
    <!-- 粒子 -->
    <div style="position:absolute;top:20%;left:30%;width:3px;height:3px;border-radius:50%;background:#cfe8ff;box-shadow:0 0 8px #9fd0ff;"></div>
    <div style="position:absolute;top:60%;left:62%;width:2px;height:2px;border-radius:50%;background:#a0b8ff;box-shadow:0 0 6px #8090ff;"></div>
    <div style="position:absolute;top:40%;left:72%;width:2px;height:2px;border-radius:50%;background:#9fd0ff;box-shadow:0 0 6px #6aa8ff;"></div>
  </div>
</div>

<div class="section">
  <h3>动画节奏</h3>
  <p>0-0.3s 白闪 → 标题 spring 砸入（发光缩放）→ 0.5-2.5s 标题持光 + 箔光斜掠 → 2.5-3s 标题放大淡出 → 切太空远景。</p>
</div>
